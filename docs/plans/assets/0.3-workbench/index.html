<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodexApp · 0.3 工作台草案</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,-apple-system,'Noto Sans CJK SC',sans-serif;color:var(--text);background:var(--bg);--bg:#fafaf9;--surface:#fff;--muted:#777873;--text:#252722;--line:#e4e5df;--soft:#f1f2ed;--accent:#426b52;--tint:#eaf2eb;--gold:#987039}body.dark{--bg:#191b19;--surface:#222522;--muted:#a1a69e;--text:#e6e9e2;--line:#3b4039;--soft:#2b302a;--accent:#a8c5a9;--tint:#303e31;--gold:#dfbc7e}button,input,textarea{font:inherit;color:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px}button:hover{background:var(--soft)}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.primary{background:var(--text);color:var(--surface);border-color:var(--text)}.primary:hover{background:var(--accent);color:var(--surface)}.muted,small{color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1px;font-weight:600}h2{font-size:19px;font-weight:600}h3{font-size:16px}small{font-size:12px}.lab{height:62px;padding:0 26px;display:flex;align-items:center;gap:9px;background:var(--surface);border-bottom:1px solid var(--line)}.lab strong{margin-right:16px;font-size:13px}.lab button{font-size:12px;padding:7px 12px}.lab button.on{background:var(--tint);border-color:var(--accent);color:var(--accent)}.lab .theme{margin-left:auto}.shell{display:flex;min-height:calc(100vh - 62px)}.nav{width:190px;flex-shrink:0;padding:28px 18px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}.brand{font-size:18px;letter-spacing:-.6px;margin:0 12px 28px}.brand i{font-style:normal;border:1px solid var(--line);padding:1px 5px;font-size:10px;color:var(--muted)}.nav button{border:0;text-align:left;background:none}.nav button.sel{background:var(--soft);font-weight:600}.nav .bottom{margin-top:auto;padding-top:32px}.main{flex:1;min-width:0;padding:42px 56px;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}.sub{margin-top:9px;color:var(--muted)}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:25px 0}.tabs button{border:0;background:none;border-radius:0;padding:12px 3px;color:var(--muted)}.tabs button.on{border-bottom:2px solid var(--accent);color:var(--text)}.callout{padding:16px 20px;background:var(--tint);border-radius:10px;display:flex;align-items:center;gap:12px;margin-bottom:28px}.callout button{margin-left:auto}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}.amber{background:var(--gold)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.card.featured{border-color:var(--accent)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.projecticon{display:grid;place-items:center;width:38px;height:38px;background:var(--soft);border-radius:10px;font-size:17px}.projectname{display:flex;gap:12px;align-items:center}.badge{font-size:11px;color:var(--accent);padding:2px 8px;background:var(--tint);border-radius:5px}.card h2{margin:24px 0 9px}.card p{color:var(--muted);font-size:13px;min-height:40px}.card footer{display:flex;align-items:center;justify-content:space-between;margin-top:28px}.note{margin-top:26px;font-size:12px;color:var(--muted)}.note b{font-weight:500;color:var(--text)}.tray{display:flex;gap:8px;margin:12px 0 28px;overflow:auto}.tray button{min-width:170px;text-align:left;padding:13px 17px}.tray button.on{border-color:var(--accent);background:var(--tint)}.tray small{display:block;margin-top:3px}.focus{max-width:880px;margin:auto}.focus .head{padding-bottom:24px;border-bottom:1px solid var(--line)}.focus .chat{padding:28px 0;min-height:290px}.user{margin-left:22%;background:var(--soft);border-radius:13px;padding:15px 20px;margin-bottom:28px}.assistant{padding:0 6px}.assistant p{margin:14px 0;line-height:1.9}.artifact{display:inline-flex;border:1px solid var(--line);padding:10px 15px;border-radius:9px;background:var(--surface);margin-right:8px}.composer{padding:18px;border:1px solid var(--line);background:var(--surface);border-radius:16px;margin-top:15px}.composer textarea{width:100%;height:65px;border:0;resize:none;background:none;outline:none}.composer .row{font-size:12px;color:var(--muted)}.focus aside{font-size:12px;padding-top:20px;display:flex;gap:20px;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(400px,1.45fr);border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:555px;overflow:hidden}.shelf{border-right:1px solid var(--line);padding:14px}.shelf input{width:100%;border:1px solid var(--line);background:var(--bg);padding:10px;border-radius:8px;margin-bottom:15px}.shelf button{display:block;width:100%;text-align:left;padding:18px 14px;border:0;border-radius:9px;margin-bottom:4px}.shelf button.on{background:var(--tint)}.shelf small{display:block;margin-top:7px}.detail{padding:32px}.detail h1{font-size:25px;margin:15px 0}.current{border:1px solid var(--line);padding:20px;border-radius:10px;margin-top:22px}.current h3{margin:7px 0 10px}.current button{margin-top:18px}.next{margin-top:22px;line-height:1.9;color:var(--muted)}.next b{color:var(--text);font-weight:500}.archive{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 20px;border-radius:9px;z-index:9}.back{margin-bottom:20px}.mobilelabel{display:none}
@media(max-width:1000px){.main{padding:30px}.nav{width:160px}.workspace{grid-template-columns:1fr 1.2fr}.detail{padding:22px}.lab{padding:0 14px}.lab strong{margin-right:0}}
@media(max-width:650px){.lab{height:auto;min-height:84px;flex-wrap:wrap;padding:10px;gap:6px}.lab strong{width:100%;font-size:12px}.lab button{padding:5px 8px}.nav{display:none}.main{padding:24px 18px}.shell{min-height:calc(100vh - 84px)}h1{font-size:25px}.top{align-items:flex-start;gap:8px}.top button{font-size:12px;white-space:nowrap}.grid{grid-template-columns:1fr}.card{padding:20px}.callout{align-items:flex-start;padding:13px;font-size:12px}.callout button{padding:6px;white-space:nowrap}.workspace{display:block}.shelf{border-right:0;border-bottom:1px solid var(--line)}.shelf button{padding:10px}.detail{padding:20px}.focus aside{flex-wrap:wrap;gap:10px}.user{margin-left:10%}.tabs{gap:14px}.card footer{margin-top:18px}}
</style>
<div class="lab"><strong>0.3 / 交互草案 · 演示数据</strong><button data-v="a">A 活跃项目首页</button><button data-v="b">B 会话优先</button><button data-v="c">C 项目书架</button><button class="theme" onclick="document.body.classList.toggle('dark')">◐ 明 / 暗</button></div><div id="app"></div><div id="toast" class="toast" hidden></div>
<script>
const projects=[{name:'CodexApp',icon:'C',title:'0.2.18 · 体验修复与工作台探索',desc:'提示关闭与草稿反馈已完成，接下来比较三种工作台布局。',state:'等你确认',time:'12 分钟前',next:'选定工作台方向，再细化首页与会话之间的切换。',path:'/home/Code/codexapp'}, {name:'Obsidian',icon:'O',title:'整理九月记录',desc:'今天的记录已整理，下一次从周回顾继续。',state:'可继续',time:'1 小时前',next:'检查本周记录，补充周回顾。',path:'/notes'}, {name:'Drift',icon:'D',title:'调优内容生成与验收',desc:'新一轮样本正在生成，完成后检查事实来源。',state:'运行中',time:'正在进行',next:'等待样本完成，查看结果与引用。',path:'/home/Code/Drift'}, {name:'Homepage',icon:'H',title:'调整服务入口',desc:'服务分组已经确定，稍后处理移动端间距。',state:'可继续',time:'昨天',next:'调整移动端卡片密度。',path:'/home/docker/homepage'}];let variant=new URLSearchParams(location.search).get('v')||'a',selected=0,view='active';
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2500)}
function nav(){return `<nav class="nav"><div class="brand">CodexApp <i>0.3</i></div><button class="sel" onclick="view='active';render()">◫ 工作台</button><button onclick="notify('草案：直接开始项目外会话，无需先建项目')">＋ 新会话</button><button onclick="view='all';render()">⌕ 全部项目</button><button onclick="notify('草案：搜索标题，按需检索历史')">◷ 历史会话</button><div class="bottom"><button onclick="notify('沿用现有自动化页面')">◴ 自动化</button><button onclick="notify('沿用现有应用页面')">▦ 应用</button><button onclick="notify('沿用现有设置页面')">⚙ 设置</button><p class="muted" style="font-size:11px;padding:14px">个人工作空间</p></div></nav>`}
function tabs(){return `<div class="tabs"><button class="${view==='active'?'on':''}" onclick="view='active';render()">活跃项目 <small>4</small></button><button class="${view==='all'?'on':''}" onclick="view='all';render()">全部项目 <small>18</small></button><button onclick="view='recent';render()">项目外会话</button></div>`}
function openProject(i){selected=i;view='chat';render()}
function card(p,i){return `<article class="card ${i===0?'featured':''}"><div class="row"><div class="projectname"><div class="projecticon">${p.icon}</div><h3>${p.name}</h3></div><span class="badge">${p.state}</span></div><h2>${p.title}</h2><p>${p.desc}</p><footer><small>${p.time}</small><button class="${i===0?'primary':''}" onclick="openProject(${i})">继续会话 ↗</button></footer></article>`}
function chat(){const p=projects[selected];return `<div class="focus"><header class="head"><div class="row"><div><div class="eyebrow">${p.name} / 当前主会话</div><h2>${p.title}</h2></div><button onclick="notify('草案：这里按需展开历史；选择旧会话不会自动更换主会话')">历史 ↗</button></div><div class="sub"><span class="dot"></span>${p.state} · ${p.path}</div></header><div class="chat"><div class="user">${selected===0?'先完成这一轮体验修复，再看看项目工作台能做成什么样。':'继续推进当前工作，完成后告诉我下一步。'}</div><div class="assistant"><small>CODEX</small><p>${p.desc}</p><p>下一步：${p.next}</p><div class="artifact">▤ ${selected===0?'工作台 UI 草案':'当前工作记录'} ↗</div></div></div><div class="composer"><textarea placeholder="继续这件事…" aria-label="会话输入"></textarea><div class="row"><span>＋　模型 ▾　推理强度 ▾</span><button class="primary" onclick="notify('草案输入，不会发送真实消息')">↑</button></div></div><aside><span>当前会话 ▾</span><a onclick="notify('草案：选择已有会话或开始新会话，再设为主会话')">更换主会话</a><a onclick="notify('草案：移出活跃区，项目与历史仍保留')">暂时搁置项目</a></aside></div>`}
function a(){return `<div class="top"><div><div class="eyebrow">YOUR WORK, IN PROGRESS</div><h1>接着做什么？</h1><p class="sub">把这段时间在做的事，留在手边。</p></div><button onclick="notify('草案：选择已有项目，或打开新目录')">＋ 添加活跃项目</button></div>${tabs()}${view==='all'?all():view==='recent'?recent():`<div class="callout"><span class="dot amber"></span><span><b>CodexApp</b> 有一组工作台草案等你看</span><button onclick="openProject(0)">查看 →</button></div><div class="grid">${projects.map(card).join('')}</div><p class="note"><b>一张卡，接续一件事。</b> 每个项目只突出一个当前会话；其余记录收在项目历史中。</p>`}`}
function b(){return `<div class="top"><div><div class="eyebrow">FOCUS SPACE</div><h1>手边的项目</h1></div><button onclick="view='all';render()">全部项目 ↗</button></div><div class="tray">${projects.slice(0,3).map((p,i)=>`<button class="${selected===i?'on':''}" onclick="selected=${i};view='active';render()"><b>${p.name}</b><small><span class="dot ${i===0?'amber':''}"></span>${p.state}</small></button>`).join('')}<button style="min-width:60px;text-align:center" onclick="notify('草案：从全部项目加入一个活跃项目')">＋</button></div>${view==='all'?all():chat()}`}
function c(){const p=projects[selected];return `<div class="top"><div><div class="eyebrow">PROJECT LIBRARY</div><h1>项目书架</h1><p class="sub">项目会一直保留，活跃列表可以很短。</p></div><button onclick="notify('草案：打开目录，加入项目书架')">＋ 项目</button></div>${tabs()}${view==='all'?all():view==='recent'?recent():`<div class="workspace"><section class="shelf"><input aria-label="筛选活跃项目" placeholder="⌕ 筛选活跃项目" oninput="document.querySelectorAll('.shelf [data-name]').forEach(e=>e.hidden=!e.dataset.name.toLowerCase().includes(this.value.toLowerCase()))">${projects.map((q,i)=>`<button data-name="${q.name}" class="${selected===i?'on':''}" onclick="selected=${i};render()"><div class="row"><b>${q.name}</b><small>${q.time}</small></div><small><span class="dot ${i===0?'amber':''}"></span>${q.state}</small></button>`).join('')}</section><section class="detail"><span class="projecticon">${p.icon}</span><h1>${p.name}</h1><small>${p.path}</small><div class="current"><div class="eyebrow">当前主会话</div><h3>${p.title}</h3><p class="muted">${p.desc}</p><button class="primary" onclick="openProject(${selected})">继续这个会话 →</button></div><div class="next"><small>下次从这里继续 · 示例手记</small><p><b>${p.next}</b></p></div><div class="row" style="margin-top:25px"><a onclick="notify('草案：按时间展开项目历史，不一次读取全部正文')">查看历史会话 ↗</a><button onclick="notify('草案：移出活跃列表，保留项目及所有历史')">暂时搁置</button></div></section></div><p class="note">手记可选。<b>直接继续会话也成立</b>，无需先填写进度或维护清单。</p>`}`}
function all(){return `<h2 style="margin:20px 0">全部项目</h2>${[...projects,{name:'JMusicWidget',title:'桌面音乐控件'},{name:'MD2A',title:'文档转换工具'}].map((p,i)=>`<div class="archive"><div><b>${p.name}</b><p class="muted">${p.title}</p></div><button onclick="${i<4?`openProject(${i})`:`notify('草案：加入活跃区后指定当前会话')`}">${i<4?'继续':'重新激活'} →</button></div>`).join('')}<p class="note">演示只列出 6 个项目；产品中分页读取。搁置不会归档或删除会话。</p>`}
function recent(){return `<h2>项目外会话</h2><div class="archive"><span>临时问题与随手讨论</span><button onclick="notify('草案：进入项目外会话，不强制选择项目')">继续 →</button></div>`}
function render(){document.querySelectorAll('[data-v]').forEach(e=>e.classList.toggle('on',e.dataset.v===variant));document.querySelector('#app').innerHTML=`<div class="shell">${nav()}<main class="main">${view==='chat'&&variant!=='b'?`<button class="back" onclick="view='active';render()">← 返回工作台</button>${chat()}`:variant==='a'?a():variant==='b'?b():c()}</main></div>`}
document.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>{variant=e.dataset.v;view='active';history.replaceState(null,'','?v='+variant);render()});render();
</script></html>
