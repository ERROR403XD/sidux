<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="app-theme-color" name="theme-color" content="#020617" />
    <script id="app-theme-bootstrap">
      (() => {
        const root = document.documentElement
        let mode = 'system'
        try { mode = localStorage.getItem('codex-web-local.dark-mode.v1') || 'system' } catch {}
        let dark = mode === 'dark'
        if (mode !== 'dark' && mode !== 'light') {
          try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches } catch { dark = false }
        }
        root.classList.toggle('dark', dark)
        const meta = document.getElementById('app-theme-color')
        if (meta) meta.setAttribute('content', dark ? '#09090b' : '#ffffff')
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codex Web" />
    <meta name="application-name" content="Codex Web" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/webui-assets/icon-32.png" data-webui-icon="32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/webui-assets/icon-192.png" data-webui-icon="192" />
    <link rel="apple-touch-icon" sizes="180x180" href="/webui-assets/icon-180.png" data-webui-icon="180" />
    <title>Codex Web</title>
    <style>
      body.app-load-pending { background: #fafafa; }
      #app-load-recovery { position: fixed; z-index: 10000; left: 12px; right: 12px; bottom: 16px; margin: auto; max-width: 420px; box-sizing: border-box; padding: 20px; border: 1px solid var(--ui-border, #d4d4d8); border-radius: 12px; background: var(--ui-surface, var(--recovery-surface, #fff)); color: var(--ui-text, var(--recovery-text, #27272a)); font: 14px/1.5 system-ui, sans-serif; box-shadow: 0 8px 32px #0002; }
      #app-load-recovery[hidden] { display: none; }
      #app-load-recovery[data-startup="true"] { top: 50%; bottom: auto; transform: translateY(-50%); background: var(--recovery-surface, #fff); color: var(--recovery-text, #27272a); border-color: var(--recovery-border, #d4d4d8); }
      #app-load-recovery p { margin: 10px 0 16px; }
      #app-load-recovery button { border: 1px solid var(--ui-border, #a1a1aa); border-radius: 8px; background: transparent; color: inherit; font: inherit; padding: 6px 10px; margin-right: 8px; cursor: pointer; }
      #app-load-recovery button:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
      #app-load-recovery[data-startup="true"] button { border-color: var(--recovery-border, #a1a1aa); }
      @media (prefers-color-scheme: dark) { body.app-load-pending { background: #09090b; } #app-load-recovery { --recovery-surface: #18181b; --recovery-text: #e4e4e7; --recovery-border: #52525b; } }
      #app-load-recovery[data-theme="light"] { --recovery-surface: #fff; --recovery-text: #27272a; --recovery-border: #d4d4d8; }
      #app-load-recovery[data-theme="dark"] { --recovery-surface: #18181b; --recovery-text: #e4e4e7; --recovery-border: #52525b; }
      body.app-load-pending:has(#app-load-recovery[data-theme="light"]) { background: #fafafa; }
      body.app-load-pending:has(#app-load-recovery[data-theme="dark"]) { background: #09090b; }
      #app-boot { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #ffffff; }
      html.dark #app-boot { background: #09090b; }
      #app-boot-inner { display: flex; align-items: center; gap: 10px; color: #71717a; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; opacity: 0; animation: app-boot-reveal 180ms ease-out 300ms forwards; }
      html.dark #app-boot-inner { color: #a1a1aa; }
      #app-boot-spinner { width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #d4d4d8; border-top-color: #6366f1; border-radius: 50%; animation: app-boot-spin 720ms linear infinite; }
      html.dark #app-boot-spinner { border-color: #3f3f46; border-top-color: #818cf8; }
      @keyframes app-boot-reveal { to { opacity: 1; } }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-inner { opacity: 1; animation: none; }
        #app-boot-spinner { display: none; }
      }
    </style>
    <script id="app-load-guard">
      (() => {
        let mounted = false
        let failed = false
        const translateRecovery = () => {
          let chinese = false
          try { chinese = localStorage.getItem('codex-web-local.ui-language.v1') === 'zh-CN' } catch {}
          const messages = {
            'app-load-title': ['Unable to load the interface', '界面加载失败'],
            'app-load-description': ['Check your connection and reload. Copy any unsent text before reloading.', '请检查网络后重新加载。重新加载前，请先复制尚未发送的文字。'],
            'app-load-reload': ['Reload', '重新加载'],
            'app-load-dismiss': ['Later', '稍后'],
            'app-boot-label': ['Loading interface…', '正在加载界面…'],
          }
          for (const [id, values] of Object.entries(messages)) {
            const element = document.getElementById(id)
            if (element) element.textContent = values[chinese ? 1 : 0]
          }
        }
        document.addEventListener('codexapp:language-change', translateRecovery)
        const hideBootOverlay = () => {
          const overlay = document.getElementById('app-boot')
          if (overlay) overlay.remove()
        }
        const show = () => {
          failed = true
          const panel = document.getElementById('app-load-recovery')
          if (!panel) return
          if (!mounted) hideBootOverlay()
          try {
            const theme = localStorage.getItem('codex-web-local.dark-mode.v1')
            if (theme === 'light' || theme === 'dark') panel.dataset.theme = theme
          } catch {}
          translateRecovery()
          panel.hidden = false
          panel.dataset.startup = String(!mounted)
          document.body.classList.toggle('app-load-pending', !mounted)
          document.getElementById('app-load-dismiss').hidden = !mounted
        }
        const timer = setTimeout(() => { if (!mounted) show() }, 15000)
        window.addEventListener('error', event => {
          const tag = event.target && event.target.tagName
          if (tag === 'SCRIPT' || (tag === 'LINK' && event.target.rel === 'stylesheet') || (!mounted && event instanceof ErrorEvent)) show()
        }, true)
        window.addEventListener('vite:preloadError', show)
        window.addEventListener('unhandledrejection', event => {
          const message = String(event.reason && (event.reason.message || event.reason))
          if (!mounted || /dynamically imported module|Importing a module script failed|Loading (?:chunk|CSS chunk)/i.test(message)) show()
        })
        document.addEventListener('DOMContentLoaded', () => {
          translateRecovery()
          document.getElementById('app-load-reload').onclick = () => {
            const url = new URL(location.href)
            url.searchParams.set('_ui_reload', String(Date.now()))
            location.replace(url.href)
          }
          document.getElementById('app-load-dismiss').onclick = () => {
            if (mounted) document.getElementById('app-load-recovery').hidden = true
          }
          if (failed) show()
        })
        document.addEventListener('codexapp:mounted', () => {
          mounted = true
          clearTimeout(timer)
          hideBootOverlay()
          if (failed) show()
          const url = new URL(location.href)
          if (url.searchParams.has('_ui_reload')) {
            url.searchParams.delete('_ui_reload')
            history.replaceState(history.state, '', url.href)
          }
        }, { once: true })
      })()
    </script>
  </head>
  <body class="bg-slate-950">
    <div id="app">
      <div id="app-boot" role="status" aria-live="polite">
        <div id="app-boot-inner">
          <span id="app-boot-spinner" aria-hidden="true"></span>
          <span id="app-boot-label">正在加载界面…</span>
        </div>
      </div>
    </div>
    <section id="app-load-recovery" hidden data-startup="true" role="alert" aria-labelledby="app-load-title">
      <strong id="app-load-title">界面未能加载</strong>
      <p id="app-load-description">请检查网络后重新加载。重新加载前，请先复制尚未发送的内容。</p>
      <button id="app-load-reload" type="button">重新加载</button>
      <button id="app-load-dismiss" type="button" hidden>稍后</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
